<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOMPASS Live-Methode</title><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#29233d;background:#f7f5fc}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e7e1f2;padding:16px 20px}main{max-width:880px;margin:25px auto;padding:0 15px}.box{padding:22px;background:#fff;border:1px solid #e8e1f1;border-radius:16px;margin-bottom:15px}.hide{display:none!important}h1{font-size:23px;margin:0}h2{margin:0 0 13px}p{color:#6b637b}a{color:#6248ab}label{display:block;margin:14px 0 5px;font-weight:650}input,textarea,select{font:inherit;width:100%;padding:11px;border:1px solid #dcd5e8;border-radius:9px}button{font:inherit;cursor:pointer;border:1px solid #dcd4e8;border-radius:9px;padding:11px 15px;background:#fff;margin:4px 4px 4px 0}button.primary{background:#6048ac;border-color:#6048ac;color:white}button:disabled{opacity:.5}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.qr{width:190px;height:190px;display:grid;place-items:center;border:1px solid #ddd;border-radius:8px}.code{font-size:32px;letter-spacing:6px;color:#6048ac;font-weight:800}.opt{display:block;border:1px solid #e2dbf0;border-radius:12px;padding:12px;margin:8px 0;background:#faf9ff;text-align:left;width:100%}.opt.selected{outline:3px solid #8266c0}.bar{height:24px;background:#eae4f6;border-radius:7px;overflow:hidden}.fill{background:#7659bc;height:100%;transition:width .3s}.result{margin:15px 0}.small{font-size:13px;color:#716a7f}.error{color:#aa2137;white-space:pre-wrap}.ok{color:#26734c}code{overflow-wrap:anywhere}</style></head><body><header><a href="./">← Methodenstudio</a><h1 id="heading">Live-Methode</h1></header><main>
<section id="start" class="box"><h2 id="createHeading">Neue Aktivität</h2><label>Titel</label><input id="title" value="Unsere Stunde"><label>Frage</label><textarea id="question" rows="3" placeholder="Was denkst du?"></textarea><label>Antwortmöglichkeiten (eine pro Zeile, 2–6)</label><textarea id="options" rows="6">Ja\nNein\nVielleicht</textarea><div id="correctWrap" class="hide"><label>Richtige Antwort (Nummer)</label><select id="correct"><option value="0">1. Antwort</option><option value="1">2. Antwort</option><option value="2">3. Antwort</option><option value="3">4. Antwort</option><option value="4">5. Antwort</option><option value="5">6. Antwort</option></select></div><button class="primary" id="startBtn">Aktivität starten</button><p id="startError" class="error"></p><hr><h3>Mit einem Code teilnehmen</h3><div class="row"><input id="joincode" inputmode="numeric" maxlength="6" placeholder="Sechsstelliger Code"><button id="joinBtn">Teilnehmen</button></div></section>
<section id="host" class="box hide"><h2 id="hostTitle"></h2><div class="row"><div><div>Raumcode</div><div id="code" class="code"></div><p class="small">Zeige den QR-Code am Smartboard.</p></div><div id="qr" class="qr"></div></div><p><a id="guestLink" target="_blank" rel="noopener"></a></p><button id="copy">Teilnahme-Link kopieren</button><button id="toggle">Abstimmung schließen</button><div id="hostStatus" role="status" class="small"></div><h3 id="hostQuestion"></h3><div id="results"></div><p class="small" id="total"></p></section>
<section id="guest" class="box hide"><h2 id="guestTitle"></h2><h3 id="guestQuestion"></h3><div id="guestOptions"></div><p id="guestStatus" role="status"></p><button id="voteBtn" class="primary">Antwort absenden</button></section></main><script>
const API='https://gexhcpyzwzybrpuygqmf.supabase.co/rest/v1/rpc/',KEY='sb_publishable_U7Dp3SXHADswPjg4Vj7mzw_kG27owvK',p=new URLSearchParams(location.search),kind=p.get('kind')==='quiz'?'quiz':'poll', $=x=>document.getElementById(x);let code='',token='',pick=-1,activity=null,timer=null;const label=kind==='quiz'?'Quiz':'Umfrage';$('heading').textContent='🟣 KOMPASS · '+label;$('createHeading').textContent='Neue '+label; if(kind==='quiz'){$('correctWrap').classList.remove('hide');$('options').value='Antwort A\nAntwort B\nAntwort C\nAntwort D'}else $('options').value='Ja\nNein\nVielleicht';
async function rpc(name,payload){let response;try{response=await fetch(API+name,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(payload)});}catch(e){throw Error('Netzwerkverbindung fehlgeschlagen: '+e.message)}const body=await response.json().catch(()=>null);if(!response.ok)throw Error(body?.message||('Serverfehler '+response.status));return body}
function show(id){['start','host','guest'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function makeLink(){return location.origin+location.pathname+'?kind='+kind+'&join='+encodeURIComponent(code)}
function qr(){const link=makeLink();$('guestLink').textContent=link;$('guestLink').href=link;$('qr').replaceChildren();if(typeof QRCode==='function')new QRCode($('qr'),{text:link,width:180,height:180,correctLevel:QRCode.CorrectLevel.M});else{let img=document.createElement('img');img.src='https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(link);img.width=180;img.height=180;img.alt='Teilnahme QR-Code';$('qr').append(img)}}
async function openHost(c,t){code=c;token=t;show('host');history.replaceState(null,'',location.pathname+'?kind='+kind+'&host='+encodeURIComponent(c)+'&key='+encodeURIComponent(t));$('code').textContent=c;qr();await refresh();clearInterval(timer);timer=setInterval(refresh,3000)}
async function refresh(){if(!token)return;try{const a=await rpc('kms_live_host',{p_code:code,p_host_token:token,p_action:'read'});activity=a;$('hostTitle').textContent=a.title;$('hostQuestion').textContent=a.question;$('toggle').textContent=a.accepting?'Abstimmung schließen':'Abstimmung öffnen';const dest=$('results');dest.replaceChildren();let total=a.counts.reduce((s,n)=>s+Number(n),0);a.options.forEach((opt,i)=>{const outer=document.createElement('div');outer.className='result';let title=document.createElement('div');title.textContent=(i+1)+'. '+opt+' – '+a.counts[i]+' ('+(total?Math.round(a.counts[i]*100/total):0)+' %)'+(a.kind==='quiz'&&i===a.correct?' ✓':'');const bar=document.createElement('div');bar.className='bar';const fill=document.createElement('div');fill.className='fill';fill.style.width=(total?a.counts[i]*100/total:0)+'%';bar.append(fill);outer.append(title,bar);dest.append(outer)});$('total').textContent=total+' Antworten';$('hostStatus').textContent='Aktualisiert: '+new Date().toLocaleTimeString('de-DE')}catch(e){$('hostStatus').textContent='Fehler: '+e.message}}
async function join(c){try{activity=await rpc('kms_live_join',{p_code:c});code=c;show('guest');history.replaceState(null,'',location.pathname+'?kind='+activity.kind+'&join='+c);$('guestTitle').textContent=activity.title;$('guestQuestion').textContent=activity.question;$('guestOptions').replaceChildren();activity.options.forEach((opt,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=(i+1)+'. '+opt;b.onclick=()=>{pick=i;document.querySelectorAll('.opt').forEach((n,j)=>n.classList.toggle('selected',i===j))};$('guestOptions').append(b)});if(!activity.accepting){$('guestStatus').textContent='Abstimmung geschlossen.';$('voteBtn').disabled=true}}catch(e){$('startError').textContent=e.message}}
$('startBtn').onclick=async()=>{const opts=$('options').value.split('\n').map(x=>x.trim()).filter(Boolean);if(opts.length<2||opts.length>6){$('startError').textContent='Bitte 2 bis 6 Antwortmöglichkeiten angeben.';return}const b=$('startBtn');b.disabled=true;$('startError').textContent='Raum wird erstellt …';try{const d=await rpc('kms_live_create',{p_kind:kind,p_title:$('title').value,p_question:$('question').value,p_options:opts,p_correct:kind==='quiz'?Number($('correct').value):null});$('startError').textContent='';await openHost(d.code,d.host_token)}catch(e){$('startError').textContent='Erstellung fehlgeschlagen: '+e.message}finally{b.disabled=false}};
$('joinBtn').onclick=()=>{const c=$('joincode').value.trim();if(!/^\d{6}$/.test(c)){$('startError').textContent='Bitte sechsstelligen Code eingeben.';return}join(c)};
$('voteBtn').onclick=async()=>{if(pick<0){$('guestStatus').textContent='Bitte eine Antwort auswählen.';return}try{let id=sessionStorage.getItem('kms_pid');if(!id){id=crypto.randomUUID();sessionStorage.setItem('kms_pid',id)}await rpc('kms_live_vote',{p_code:code,p_participant:id,p_selected:pick});$('guestStatus').textContent='Antwort gesendet!';$('guestStatus').className='ok'}catch(e){$('guestStatus').textContent=e.message;$('guestStatus').className='error'}};
$('toggle').onclick=async()=>{try{await rpc('kms_live_host',{p_code:code,p_host_token:token,p_action:activity.accepting?'close':'open'});refresh()}catch(e){$('hostStatus').textContent=e.message}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(makeLink());$('hostStatus').textContent='Link kopiert.'}catch(e){$('hostStatus').textContent='Link bitte oben markieren und kopieren.'}};
if(p.get('host')&&p.get('key'))openHost(p.get('host'),p.get('key'));else if(p.get('join'))join(p.get('join'));
</script></body></html>
